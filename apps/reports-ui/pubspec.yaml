name: go_no_go_reports_ui
description: Browser UI for reading Go/No-Go engine artifacts.
version: 0.0.1

environment:
  # jaspr_router 0.9 requires Dart 3.11 or newer.
  sdk: ^3.11.0

dependencies:
  # Browser-to-server API client used by the Jaspr UI.
  http: ^1.6.0
  # Server-rendered UI framework and its route definitions.
  jaspr: ^0.23.3
  jaspr_router: ^0.9.0
  # Safe file-system path construction for server-side artifact access.
  path: ^1.9.1
  # HTTP server and declarative API routing for local-only endpoints.
  shelf: ^1.4.0
  shelf_router: ^1.1.0
  # Parser for engine configuration and saved evaluation metadata.
  yaml: ^3.1.3

dev_dependencies:
  # Runs the code generators used by Jaspr during development and builds.
  build_runner: ^2.15.1
  # Latest version compatible with the current Jaspr 0.23.x toolchain.
  build_web_compilers: ^4.8.0
  # Jaspr's build integration; keep it aligned with the Jaspr runtime.
  jaspr_builder: ^0.23.3
  # Recommended static-analysis rules for Dart packages.
  lints: ^6.1.0

jaspr:
  mode: server
  port: 8792
